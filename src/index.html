<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <title>Montepinar</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" type="image/png" href="favicon.png">
  <!-- Estilos del loader inline: así cubre toda la pantalla desde el primer frame,
       sin depender de que styles.css ya se haya cargado. -->
  <style>
    html:has(#app-loader:not(.is-leaving)),
    body:has(#app-loader:not(.is-leaving)) {
      overflow: hidden;
      background: #faf6f0;
    }
    
    /* Loader inicial: una casita que se arma pieza por pieza mientras sube el contador. */
    @property --n {
      syntax: '<integer>';
      inherits: false;
      initial-value: 0;
    }
    
    #app-loader {
      --w: clamp(260px, 32vw, 440px);
      position: fixed;
      inset: 0;
      z-index: 9999;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: .6rem;
      background: #faf6f0;
    }
    
    #app-loader .loader-lockup {
      position: relative;
      width: var(--w);
    }
    
    #app-loader .loader-house {
      display: block;
      width: 100%;
      overflow: visible;
    }
    
    #app-loader .p {
      opacity: 0;
      transform-box: fill-box;
      transform-origin: center bottom;
      animation: loader-drop .55s cubic-bezier(.34, 1.4, .64, 1) var(--d) forwards;
    }
    
    #app-loader .loader-meta {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: .5rem;
    }
    
    #app-loader .loader-word {
      display: flex;
      justify-content: center;
      position: absolute;
      top: 71%;
      left: 22%;
      right: 0;
      font: 800 calc(var(--w) * .08)/1 var(--font-corporate, system-ui), sans-serif;
      letter-spacing: .18em;
      color: #0b442d;
    }
    
    #app-loader .loader-word span {
      opacity: 0;
      transform: translateY(.5em);
      animation: loader-letter .45s cubic-bezier(.22, 1, .36, 1) calc(.3s + var(--i) * .17s) forwards;
    }
    
    #app-loader .loader-count {
      --n: 0;
      counter-reset: n var(--n);
      font: 800 .8rem/1 var(--font-corporate, system-ui), sans-serif;
      letter-spacing: .18em;
      color: #087940;
      animation: loader-count 2.62s cubic-bezier(.65, 0, .35, 1) forwards;
    }
    
    #app-loader .loader-count::after {
      content: counter(n) '%';
    }
    
    @keyframes loader-drop {
      from {
        opacity: 0;
        transform: translateY(-46px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }
    
    @keyframes loader-letter {
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }
    
    @keyframes loader-count {
      to {
        --n: 100;
      }
    }
    
    @media (prefers-reduced-motion: reduce) {
      #app-loader .p {
        animation: none;
        opacity: 1;
      }
    
      #app-loader .loader-word span {
        animation: none;
        opacity: 1;
        transform: none;
      }
    }
  </style>
</head>

<body>
  <div id="app-loader" role="status" aria-label="Cargando">
    <div class="loader-lockup">
    <svg class="loader-house" viewBox="0 0 490 136" aria-hidden="true">
      <g transform="translate(11 0)">
      <rect class="p" style="--d:0.23s" x="49" y="118" width="12" height="18" fill="#0b442d"/>
      <polygon class="p" style="--d:0.36s" points="5,122 105,122 55,76" fill="#087940"/><polygon class="p" style="--d:0.49s" points="13,100 97,100 55,50" fill="#1faa3f"/><polygon class="p" style="--d:0.62s" points="23,70 87,70 55,25" fill="#087940"/><polygon class="p" style="--d:0.75s" points="33,42 77,42 55,4" fill="#1faa3f"/>
      </g>
      <line class="p" style="--d:0.88s;stroke:#FB8B1F;stroke-width:7;stroke-linecap:round" x1="128" y1="40" x2="128" y2="84"/>
      <g class="p" style="--d:1.01s;stroke:#FB8B1F;stroke-width:4;fill:none"><rect x="198" y="50" width="34" height="30"/><line x1="215" y1="50" x2="215" y2="80"/><line x1="198" y1="65" x2="232" y2="65"/></g>
      <rect class="p" style="--d:1.14s" x="236" y="2" width="14" height="18" fill="#FB8B1F"/>
      <polyline class="p" style="--d:1.27s;stroke:#FB8B1F;stroke-width:8;stroke-linecap:round;stroke-linejoin:round;fill:none" points="120,42 243,10 304,38"/>
      <rect class="p" style="--d:1.40s" x="425" y="44" width="12" height="16" fill="#FB8B1F"/>
      <polygon class="p" style="--d:1.53s" points="250,86 428,52 480,84" fill="#FB8B1F"/>
    </svg>
    <span class="loader-word" aria-hidden="true"><span style="--i:0">M</span><span style="--i:1">O</span><span style="--i:2">N</span><span style="--i:3">T</span><span style="--i:4">E</span><span style="--i:5">P</span><span style="--i:6">I</span><span style="--i:7">N</span><span style="--i:8">A</span><span style="--i:9">R</span></span>
    </div>
    <div class="loader-meta">
      
      <span class="loader-count" aria-hidden="true"></span>
    </div>
  </div>

  <app-root></app-root>
</body>

</html>
