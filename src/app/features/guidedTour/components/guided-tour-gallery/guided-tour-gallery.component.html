<section #root aria-labelledby="tour-gallery-title"
  class="bg-white py-[clamp(4.5rem,8vw,7.5rem)] text-[var(--brand-forest-900)]">
  <div class="mx-auto w-[min(88%,1400px)]">
    <header data-heading class="mb-[clamp(2rem,4vw,3rem)] flex flex-wrap items-end justify-between gap-6">
      <div>
        <p data-head class="mb-5 flex items-center gap-3 text-xs font-extrabold uppercase tracking-[0.18em] text-[var(--brand-tertiary)]">
          <span class="h-0.5 w-9 bg-[var(--brand-primary)]" aria-hidden="true"></span>
          Así se vive
        </p>
        <h2 id="tour-gallery-title" data-head
          class="m-0 max-w-[16ch] text-balance text-[clamp(2.2rem,4.4vw,3.75rem)] font-extrabold leading-[1.04] tracking-[-0.04em]">
          Momentos reales de nuestras visitas.
        </h2>
      </div>
      <p data-head class="m-0 max-w-xs text-pretty text-base leading-relaxed text-[#1f1a14]/65">
        Fotos de visitantes como tú, recorriendo Montepinar con nuestro equipo.
      </p>
    </header>

    <ul data-grid class="m-0 grid list-none auto-rows-[11rem] grid-cols-2 gap-3 p-0 sm:auto-rows-[13rem] md:grid-cols-6 md:gap-4">
      @for (photo of photos; track photo.image) {
      <li data-photo [class]="'group/photo relative overflow-hidden rounded-3xl bg-[#f4f1ea] ' + photo.span">
        <img class="absolute inset-0 size-full object-cover transition-transform duration-700 ease-out group-hover/photo:scale-105 motion-reduce:transition-none"
          [src]="photo.image" [alt]="photo.alt" [style.object-position]="photo.position ?? '50% 50%'" loading="lazy" />
        <span aria-hidden="true" class="absolute inset-0 bg-gradient-to-t from-black/60 via-transparent to-transparent"></span>
        <p class="absolute inset-x-0 bottom-0 m-0 p-4 text-sm font-extrabold leading-snug text-white sm:p-5">{{ photo.caption }}</p>
      </li>
      }
    </ul>
  </div>
</section>
