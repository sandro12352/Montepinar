<section #root id="recorrido" aria-labelledby="tour-journey-title"
  class="overflow-x-clip bg-[var(--brand-forest-900)] py-[clamp(4.5rem,8vw,7rem)] text-white">
  <div class="mx-auto w-[min(88%,1400px)]">
    <header data-heading class="mb-[clamp(2rem,4vw,3rem)] flex flex-wrap items-end justify-between gap-6">
      <div>
        <p data-head class="mb-5 flex items-center gap-3 text-xs font-extrabold uppercase tracking-[0.18em] text-[var(--brand-orange-300)]">
          <span class="h-0.5 w-9 bg-[var(--brand-primary)]" aria-hidden="true"></span>
          El recorrido
        </p>
        <h2 id="tour-journey-title" data-head
          class="m-0 max-w-[16ch] text-balance text-[clamp(2.2rem,4.4vw,3.75rem)] font-extrabold leading-[1.04] tracking-[-0.04em]">
          Del punto de recojo al regreso, paso a paso.
        </h2>
      </div>
      <p data-head class="m-0 max-w-xs text-pretty text-base leading-relaxed text-white/65">
        Así se vive el día completo. Sigue bajando para recorrerlo.
      </p>
    </header>

  </div>

  <div data-viewport class="lg:flex lg:h-[min(38rem,calc(100svh-6rem))] lg:flex-col lg:justify-center">
    <!-- Riel de progreso con el bus (solo escritorio) -->
    <div aria-hidden="true" class="relative mx-auto mb-10 hidden h-9 w-[min(88%,1400px)] lg:block">
      <span class="absolute inset-x-0 top-1/2 h-0.5 -translate-y-1/2 bg-white/15"></span>
      <span data-progress class="absolute inset-x-0 top-1/2 h-0.5 origin-left -translate-y-1/2 scale-x-0 bg-[var(--brand-primary)]"></span>
      <span data-bus
        class="absolute left-0 top-1/2 grid size-9 -translate-x-1/2 -translate-y-1/2 place-items-center rounded-full bg-[var(--brand-primary)] text-white shadow-lg shadow-black/30">
        <ng-icon name="lucideBus" size="18" />
      </span>
    </div>

    <ol data-track
      class="m-0 flex w-[min(88%,1400px)] list-none flex-col gap-14 p-0 max-lg:mx-auto lg:ml-[max(6%,calc((100vw-1400px)/2))] lg:w-max lg:flex-row lg:gap-16 lg:pr-[10vw]">
      @for (step of steps; track step.number) {
      <li data-panel class="flex flex-col gap-6 sm:flex-row sm:items-center sm:gap-8 lg:w-[56rem] lg:shrink-0">
        <!-- Arco con la foto -->
        <div class="relative aspect-[4/3] w-full max-w-[30rem] shrink-0 overflow-hidden rounded-[1.5rem] rounded-tl-[5rem] bg-[var(--brand-forest-800)] ring-1 ring-white/15 sm:w-[24rem] lg:w-[30rem]">
          @if (step.contain) {
          <img class="absolute inset-0 size-full object-contain object-center p-3" [src]="step.image" [alt]="step.imageAlt" loading="lazy" />
          } @else {
          <img data-parallax class="absolute -inset-x-[12%] inset-y-0 h-full w-[124%] max-w-none object-cover" [src]="step.image" [alt]="step.imageAlt"
            [style.object-position]="step.position ?? '50% 50%'" loading="lazy" />
          }
          <span aria-hidden="true" class="absolute inset-0 bg-gradient-to-t from-[var(--brand-forest-900)]/50 via-transparent to-transparent"></span>
        </div>

        <div class="pb-2">
          <p class="m-0 flex items-center gap-3">
            <span class="text-[clamp(3.5rem,6vw,5rem)] font-black leading-none tracking-[-0.05em] text-transparent [-webkit-text-stroke:1.5px_rgb(253_199_155/0.7)]">{{ step.number }}</span>
            <span class="grid size-11 place-items-center rounded-full bg-[var(--brand-primary)] text-white">
              <ng-icon [name]="step.icon" size="20" aria-hidden="true" />
            </span>
          </p>
          <h3 class="m-0 mt-4 max-w-[14ch] text-balance text-2xl font-extrabold leading-tight tracking-tight sm:text-[1.75rem]">{{ step.title }}</h3>
          <p class="mb-0 mt-3 max-w-sm text-pretty text-sm leading-relaxed text-white/70 sm:text-base">{{ step.text }}</p>
        </div>
      </li>
      }
    </ol>
  </div>
</section>
