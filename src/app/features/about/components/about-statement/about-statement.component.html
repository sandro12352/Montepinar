<section #root aria-labelledby="about-statement-title"
  class="relative isolate overflow-hidden bg-[var(--brand-forest-900)] py-[clamp(6rem,12vw,11rem)] text-white">
  <span data-orb aria-hidden="true"
    class="pointer-events-none absolute -left-32 top-1/4 -z-10 size-[30rem] rounded-full bg-[var(--brand-primary)]/15 blur-3xl"></span>
  <span aria-hidden="true"
    class="pointer-events-none absolute -bottom-32 -right-24 -z-10 size-[28rem] rounded-full bg-[var(--brand-forest-400)]/20 blur-3xl"></span>

  <div class="mx-auto w-[min(88%,70rem)] text-center">
    <h2 id="about-statement-title"
      class="m-0 text-balance text-[clamp(2.5rem,6.4vw,5.5rem)] font-extrabold leading-[1.05] tracking-[-0.045em]">
      @for (word of words; track $index) {
      <span data-word class="inline-block" [class]="word.accent ? 'text-[var(--brand-primary)]' : ''">{{ word.text }}&nbsp;</span>
      }
    </h2>

    <p data-after class="mx-auto mb-0 mt-8 max-w-2xl text-pretty text-base leading-[1.8] text-white/70 sm:text-lg">
      Montepinar es un lugar de confianza para comprar tu terreno con claridad y acompañamiento. Reunimos proyectos
      verificados, personas cercanas y entornos pensados para vivir con tranquilidad.
    </p>
  </div>
</section>
