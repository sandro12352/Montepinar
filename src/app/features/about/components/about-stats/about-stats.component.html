<section #root aria-labelledby="about-stats-title"
  class="relative isolate overflow-hidden bg-[var(--brand-forest-900)] py-[clamp(4.5rem,8vw,7.5rem)] text-white">
  <span data-orb aria-hidden="true"
    class="pointer-events-none absolute -left-32 top-0 -z-10 size-[28rem] rounded-full bg-[var(--brand-primary)]/15 blur-3xl"></span>
  <span aria-hidden="true"
    class="pointer-events-none absolute -bottom-32 -right-24 -z-10 size-[28rem] rounded-full bg-[var(--brand-forest-400)]/20 blur-3xl"></span>

  <div class="mx-auto grid w-[min(88%,1400px)] gap-14 lg:grid-cols-[minmax(0,0.8fr)_minmax(0,1.2fr)] lg:gap-20">
    <header data-heading class="h-fit lg:sticky lg:top-28 lg:self-start">
      <p data-head class="mb-5 flex items-center gap-3 text-xs font-extrabold uppercase tracking-[0.18em] text-[var(--brand-primary)]">
        <span class="h-0.5 w-9 bg-[var(--brand-primary)]" aria-hidden="true"></span>
        Nuestro impacto
      </p>
      <h2 id="about-stats-title" data-head
        class="m-0 max-w-[14ch] text-balance text-[clamp(2.4rem,4.6vw,4.25rem)] font-extrabold leading-[1.03] tracking-[-0.045em]">
        Miles de familias confían en Montepinar.
      </h2>
      <p data-head class="mb-0 mt-5 max-w-md text-pretty text-base leading-relaxed text-white/75 sm:text-lg">
        Cada cifra representa una historia que empezó con una visita y hoy es un hogar.
      </p>
      <a data-head routerLink="/projects"
        class="group/btn relative isolate mt-8 inline-flex min-h-12 items-center gap-3 overflow-hidden rounded-xl bg-[var(--brand-primary)] px-6 py-3.5 text-sm font-extrabold text-white no-underline transition-transform duration-200 hover:-translate-y-0.5 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-white focus-visible:ring-offset-2 focus-visible:ring-offset-[var(--brand-forest-900)] motion-reduce:transition-none">
        <span aria-hidden="true"
          class="absolute inset-0 origin-left scale-x-0 bg-[var(--brand-orange-600)] transition-transform duration-500 ease-out group-hover/btn:scale-x-100 group-focus-visible/btn:scale-x-100 motion-reduce:transition-none"></span>
        <span class="relative z-10">Ver proyectos</span>
        <ng-icon name="lucideArrowRight" size="18" aria-hidden="true"
          class="relative z-10 transition-transform duration-200 group-hover/btn:translate-x-1 motion-reduce:transition-none" />
      </a>
    </header>

    <dl data-stats class="m-0 grid sm:grid-cols-2">
      @for (stat of stats; track stat.label) {
      <div data-stat class="group/stat relative py-9 sm:px-8 sm:first:pl-0 sm:even:pr-0">
        <span data-rule aria-hidden="true" class="absolute inset-x-0 top-0 h-px origin-left bg-white/20 transition-colors duration-500 group-hover/stat:bg-[var(--brand-primary)]"></span>
        <dd class="m-0 text-[clamp(3.5rem,7vw,6rem)] font-black leading-none tracking-[-0.05em] transition-colors duration-500 group-hover/stat:text-[var(--brand-primary)]">
          {{ stat.prefix }}<span [attr.data-count]="stat.value">{{ stat.value }}</span>{{ stat.suffix }}
        </dd>
        <dt class="mt-4 text-xs font-extrabold uppercase tracking-[0.16em] text-[var(--brand-orange-300)]">{{ stat.label }}</dt>
        <p class="mb-0 mt-2 max-w-[18rem] text-sm leading-relaxed text-white/65">{{ stat.text }}</p>
      </div>
      }
    </dl>
  </div>
</section>
