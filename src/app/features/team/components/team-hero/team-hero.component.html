<section #root aria-labelledby="team-hero-title"
  class="relative isolate overflow-hidden bg-[var(--brand-forest-900)] pt-[clamp(7.5rem,12vw,9.5rem)] text-white">
  <span aria-hidden="true"
    class="pointer-events-none absolute -left-32 top-1/3 -z-10 size-[26rem] rounded-full bg-[var(--brand-primary)]/12 blur-3xl"></span>
    <div class="mx-auto grid w-[85%] items-end gap-10 lg:grid-cols-[0.8fr_1.2fr]">
    <!-- Texto -->
    <div class="flex flex-col items-start pb-4 lg:pb-[clamp(2.5rem,6vw,5rem)]">
      <nav data-reveal hlmBreadcrumb aria-label="Migas de pan" class="mb-8">
        <ol hlmBreadcrumbList class="gap-1.5 text-xs font-extrabold uppercase tracking-[0.14em] text-white/70 sm:gap-2">
          <li hlmBreadcrumbItem>
            <a hlmBreadcrumbLink link="/" class="text-white/70 no-underline hover:text-white">Inicio</a>
          </li>
          <li hlmBreadcrumbSeparator class="text-white/50"></li>
          <li hlmBreadcrumbItem>
            <a hlmBreadcrumbLink link="/about" class="text-white/70 no-underline hover:text-white">Nosotros</a>
          </li>
          <li hlmBreadcrumbSeparator class="text-white/50"></li>
          <li hlmBreadcrumbItem>
            <span hlmBreadcrumbPage class="text-white">Equipo</span>
          </li>
        </ol>
      </nav>

      <p data-reveal
        class="m-0 inline-flex items-center gap-2 rounded-full border border-white/15 bg-white/5 px-4 py-1.5 text-xs font-extrabold uppercase tracking-[0.16em] text-white/90">
        <span class="size-1.5 rounded-full bg-[var(--brand-primary)]" aria-hidden="true"></span>
        Nuestro equipo
      </p>

      <h1 id="team-hero-title" data-reveal
        class="m-0 mt-6 max-w-[15ch] text-balance text-[clamp(2.6rem,5.6vw,5rem)] font-extrabold leading-[1.02] tracking-[-0.045em]">
        Personas reales, a tu lado en <span class="text-[var(--brand-primary)]">cada paso</span>.
      </h1>

      <p data-reveal class="mb-0 mt-5 max-w-md text-pretty text-base leading-[1.75] text-white/75 sm:text-lg">
        Un equipo pequeño y cercano que te acompaña desde la primera visita hasta que recibes tu lote.
      </p>

      <button data-reveal type="button" (click)="openVisit()"
        class="group/btn relative isolate mt-8 inline-flex min-h-12 cursor-pointer items-center gap-3 overflow-hidden rounded-xl border-0 bg-[var(--brand-primary)] px-6 py-3.5 text-sm font-extrabold text-white shadow-lg shadow-black/25 transition-transform duration-200 hover:-translate-y-0.5 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-white focus-visible:ring-offset-2 focus-visible:ring-offset-[var(--brand-forest-900)] motion-reduce:transition-none">
        <span aria-hidden="true"
          class="absolute inset-0 origin-left scale-x-0 bg-[var(--brand-orange-600)] transition-transform duration-500 ease-out group-hover/btn:scale-x-100 group-focus-visible/btn:scale-x-100 motion-reduce:transition-none"></span>
        <ng-icon name="lucideCalendarDays" size="18" aria-hidden="true" class="relative z-10" />
        <span class="relative z-10">Conocernos en una visita</span>
      </button>
    </div>

    <!-- Foto del equipo (PNG sin fondo, apoyada sobre el borde inferior) -->
    <div class="relative mx-auto w-full max-w-[56rem] self-end lg:-mr-[4%] lg:w-[100%] lg:max-w-none">
      <img data-img class="relative z-10 block h-auto w-full scale-120" [src]="teamPhoto"
        alt="El equipo de Montepinar reunido, con polos verdes de la marca" fetchpriority="high" />

      <div data-tag
        class="absolute bottom-6 left-0 z-20 flex items-center gap-3 rounded-2xl border border-white/20 bg-[var(--brand-forest-900)]/75 px-5 py-3.5 shadow-xl shadow-black/30 backdrop-blur-md sm:-left-6">
        <span class="grid size-10 place-items-center rounded-full bg-[var(--brand-primary)]">
          <ng-icon name="lucideUsers" size="20" aria-hidden="true" />
        </span>
        <span>
          <strong class="block text-sm font-extrabold">Un solo equipo</strong>
          <span class="mt-0.5 block text-xs text-[var(--brand-orange-300)]">Cerca de ti, antes y después de comprar</span>
        </span>
      </div>
    </div>
    </div>
</section>
