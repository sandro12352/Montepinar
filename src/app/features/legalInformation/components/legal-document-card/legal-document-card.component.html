<article
  class="group/doc relative flex h-full flex-col rounded-3xl border border-[var(--brand-forest-900)]/8 bg-white p-6 shadow-sm shadow-[var(--brand-forest-900)]/5 transition-all duration-300 hover:-translate-y-1 hover:shadow-xl hover:shadow-[var(--brand-forest-900)]/10 motion-reduce:transition-none">
  <div class="flex items-start justify-between gap-3">
    <span class="grid size-12 place-items-center rounded-2xl bg-[var(--brand-primary)]/10 text-[var(--brand-primary)] transition-colors duration-300 group-hover/doc:bg-[var(--brand-primary)] group-hover/doc:text-white">
      <ng-icon [name]="document().icon" size="22" aria-hidden="true" />
    </span>
    <span class="text-xs font-extrabold tabular-nums text-[var(--brand-forest-900)]/30">{{ index() + 1 | number: '2.0-0' }}</span>
  </div>

  <h3 class="m-0 mt-5 text-lg font-extrabold leading-snug tracking-tight text-[var(--brand-forest-900)]">{{ document().title }}</h3>
  <p class="mb-0 mt-2 flex-1 text-sm leading-relaxed text-[#1f1a14]/60">{{ document().description }}</p>

  <div class="mt-6">
    @if (document().file; as file) {
    <a [href]="file" target="_blank" rel="noopener"
      class="inline-flex items-center gap-2 text-sm font-extrabold text-[var(--brand-forest-900)] no-underline transition-colors hover:text-[var(--brand-primary)] focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-[var(--brand-primary)] focus-visible:ring-offset-2">
      Ver documento
      <ng-icon name="lucideArrowUpRight" size="16" aria-hidden="true" />
    </a>
    } @else {
    <span class="inline-flex items-center gap-2 rounded-full bg-[#f4f1ea] px-3 py-1 text-xs font-extrabold text-[var(--brand-forest-900)]/55">
      <ng-icon name="lucideClock" size="14" aria-hidden="true" />
      Próximamente
    </span>
    }
  </div>
</article>
