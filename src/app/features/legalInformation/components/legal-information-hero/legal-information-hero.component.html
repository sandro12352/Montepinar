<section #root aria-labelledby="legal-hero-title"
  class="relative isolate overflow-hidden bg-[var(--brand-forest-900)] pb-[clamp(3.5rem,7vw,6rem)] pt-[clamp(7.5rem,12vw,9.5rem)] text-white">
  <span aria-hidden="true"
    class="pointer-events-none absolute -left-32 top-1/3 -z-10 size-[26rem] rounded-full bg-[var(--brand-primary)]/12 blur-3xl"></span>
  <span aria-hidden="true"
    class="pointer-events-none absolute -right-24 -top-24 -z-10 size-[22rem] rounded-full bg-white/5 blur-3xl"></span>

  <div class="mx-auto w-[min(88%,1400px)]">
    <nav data-reveal hlmBreadcrumb aria-label="Migas de pan" class="mb-8">
      <ol hlmBreadcrumbList class="gap-1.5 text-xs font-extrabold uppercase tracking-[0.14em] text-white/70 sm:gap-2">
        <li hlmBreadcrumbItem>
          <a hlmBreadcrumbLink link="/" class="text-white/70 no-underline hover:text-white">Inicio</a>
        </li>
        <li hlmBreadcrumbSeparator class="text-white/50"></li>
        <li hlmBreadcrumbItem>
          <span hlmBreadcrumbPage class="text-white">Información legal</span>
        </li>
      </ol>
    </nav>

    <div class="grid items-end gap-8 lg:grid-cols-[1.3fr_0.7fr]">
      <div>
        <p data-reveal
          class="m-0 inline-flex items-center gap-2 rounded-full border border-white/15 bg-white/5 px-4 py-1.5 text-xs font-extrabold uppercase tracking-[0.16em] text-white/90">
          <span class="size-1.5 rounded-full bg-[var(--brand-primary)]" aria-hidden="true"></span>
          Documentación en regla
        </p>
        <h1 id="legal-hero-title" data-reveal
          class="m-0 mt-6 max-w-[16ch] text-balance text-[clamp(2.6rem,5.6vw,5rem)] font-extrabold leading-[1.02] tracking-[-0.045em]">
          Tu inversión, <span class="text-[var(--brand-primary)]">respaldada</span> en papel.
        </h1>
        <p data-reveal class="mb-0 mt-5 max-w-xl text-pretty text-base leading-[1.75] text-white/75 sm:text-lg">
          Consulta los documentos legales de cada proyecto: partidas, habilitación, estudios y constancias, siempre a tu alcance.
        </p>
      </div>

      <div data-reveal
        class="flex items-center gap-4 rounded-2xl border border-white/15 bg-white/5 px-5 py-4 backdrop-blur-md lg:justify-self-end">
        <span class="grid size-12 shrink-0 place-items-center rounded-full bg-[var(--brand-primary)]">
          <ng-icon name="lucideShieldCheck" size="22" aria-hidden="true" />
        </span>
        <span>
          <strong class="block text-sm font-extrabold">Transparencia total</strong>
          <span class="mt-0.5 block text-xs text-[var(--brand-orange-300)]">Documentos verificables, sin letra chica</span>
        </span>
      </div>
    </div>
  </div>
</section>
