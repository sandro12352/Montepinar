<section
  class="relative isolate min-h-dvh overflow-hidden bg-[var(--brand-tertiary)] text-white outline-none focus-visible:shadow-[inset_0_0_0_3px_var(--brand-primary)] max-sm:min-h-[calc(100vh-4.75rem)]"
  aria-label="Presentación de Montepinar" tabindex="0">
  <hlm-carousel class="absolute inset-0 h-full w-full" [options]="{ loop: true ,duration:40}" [plugins]="carrouselPlugins">
    <hlm-carousel-content class="h-screen ">
      @for (slide of slides; track slide.title; let index = $index) {

      <hlm-carousel-item class="h-full basis-full pl-0 ">

        <article #slideContent
          class="relative overflow-hidden flex h-full items-center bg-cover bg-center bg-no-repeat px-[max(1.5rem,calc((87%-77rem)/2))] py-[clamp(4rem,10vw,8rem)] transition-[opacity,transform] duration-700 ease-out max-sm:items-start max-sm:pt-[5.5rem] "
          [class]="slide.theme">

          @if (slide.video) {
          <video #slideVideo class="absolute inset-0 z-0 size-full object-cover" autoplay muted loop playsinline
            preload="metadata"  aria-hidden="true">
            <source [src]="slide.video" type="video/mp4" />
          </video>
          } @else if (slide.imagen) {
          <img data-zoom class="absolute inset-0 z-0 size-full object-cover will-change-transform" [src]="slide.imagen" alt=""
            [attr.loading]="index === 0 ? 'eager' : 'lazy'" aria-hidden="true" />
          }
          <!-- Velo base muy ligero: unifica cualquier imagen o video -->
          <div class="pointer-events-none absolute inset-0 z-1 bg-black/15"></div>

          <!-- Superior: solo para nav y logo, se funde rápido -->
          

          <!-- Lateral: apoya el texto sin apagar el lado derecho -->
          <div
            class="pointer-events-none absolute inset-0 z-1 bg-linear-to-r from-black/15 via-black/15 to-transparent">
          </div>

          <div class="relative z-2 w-full max-w-165">

            <p #subtitulo class="opacity-0 mb-4 text-[0.78rem] font-extrabold uppercase tracking-[0.16em] text-white underline decoration-[var(--brand-primary)] decoration-2 underline-offset-4">
              {{ slide.eyebrow }}
            </p>

            <h1 #titulo
              class="opacity-0 m-0 max-w-[11ch] text-[clamp(2.7rem,6vw,5.4rem)] font-extrabold leading-[0.98] tracking-[-0.055em] max-sm:text-[clamp(2.7rem,13vw,4rem)]">
              {{ slide.title }}
            </h1>

            <p #descripcion class="opacity-0 my-6 max-w-136 text-[clamp(1rem,1.6vw,1.2rem)] leading-[1.65] text-white/85">
              {{ slide.description }}
            </p>

            <a #boton
              class="opacity-0 group relative inline-flex items-center gap-4 overflow-hidden rounded-lg bg-[var(--brand-primary)] px-8 py-4 text-sm font-extrabold uppercase tracking-[0.14em] text-white no-underline shadow-lg shadow-black/30 transition-transform duration-150 hover:-translate-y-0.5 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-[var(--brand-primary)] focus-visible:ring-offset-2 focus-visible:ring-offset-black/40"
              [href]="slide.href">

              <!-- Relleno oscuro que entra de izquierda a derecha en hover -->
              <span
                class="absolute inset-0 origin-left scale-x-0 bg-[var(--brand-tertiary)] transition-transform duration-500 ease-out group-hover:scale-x-100"
                aria-hidden="true"></span>

              <span class="relative z-10">{{ slide.action }}</span>

              <ng-icon class="relative z-10" name="lucideMapPinHouse" size="20" aria-hidden="true" />
            </a>

          </div>
        </article>

      </hlm-carousel-item>
      }
    </hlm-carousel-content>



    <button hlm-carousel-previous
      class="left-5 top-1/2 size-11 -translate-y-1/2 bg-black/30 text-white hover:bg-[var(--brand-primary)] max-sm:left-3"
      type="button"></button>
    <button hlm-carousel-next
      class="right-5 top-1/2 size-11 -translate-y-1/2   bg-black/30 text-white hover:bg-[var(--brand-primary)] max-sm:right-3"
      type="button"></button>
  </hlm-carousel>

  <div class="absolute bottom-8 left-1/2 z-10 flex -translate-x-1/2 gap-2 max-sm:bottom-6" role="tablist"
    aria-label="Seleccionar diapositiva">
    @for (slide of slides; track slide.title; let index = $index) {
    <button type="button" role="tab" [attr.aria-label]="'Ir a la diapositiva ' + (index + 1)"></button>
    }
  </div>
</section>
