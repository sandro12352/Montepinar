<section #root aria-labelledby="contact-hero-title"
  class="relative isolate flex min-h-[clamp(26rem,52vh,36rem)] items-end overflow-hidden bg-[var(--brand-forest-900)] pb-[clamp(3rem,6vw,5rem)] pt-[clamp(8rem,12vw,10rem)] text-white">
  <span data-orb aria-hidden="true"
    class="pointer-events-none absolute -right-20 -top-10 -z-10 size-[30rem] rounded-full bg-[var(--brand-primary)]/20 blur-3xl"></span>
  <span aria-hidden="true"
    class="pointer-events-none absolute -left-24 bottom-0 -z-10 size-[22rem] rounded-full bg-[var(--brand-forest-400)]/15 blur-3xl"></span>

  <div class="mx-auto flex w-[min(88%,1400px)] flex-wrap items-end justify-between gap-x-12 gap-y-6">
    <div>
      <nav data-reveal hlmBreadcrumb aria-label="Migas de pan" class="mb-6">
        <ol hlmBreadcrumbList class="gap-1.5 text-xs font-extrabold uppercase tracking-[0.14em] text-white/70 sm:gap-2">
          <li hlmBreadcrumbItem>
            <a hlmBreadcrumbLink link="/" class="text-white/70 no-underline hover:text-white">Inicio</a>
          </li>
          <li hlmBreadcrumbSeparator class="text-white/50"></li>
          <li hlmBreadcrumbItem>
            <span hlmBreadcrumbPage class="text-white">Contacto</span>
          </li>
        </ol>
      </nav>

      <h1 id="contact-hero-title"
        class="m-0 text-[clamp(3.5rem,10vw,9rem)] font-medium leading-[0.95] tracking-[-0.05em]">
        <span class="block overflow-hidden pb-[0.1em]"><span data-word class="block">Contáctanos<span class="text-[var(--brand-primary)]">.</span></span></span>
      </h1>
    </div>

    <p data-reveal class="m-0 max-w-sm text-pretty text-base leading-relaxed text-white/75 sm:text-lg">
      Escríbenos y un asesor te responde por WhatsApp. Sin compromiso.
    </p>
  </div>
</section>
