<section #root id="formulario" aria-labelledby="contact-form-title"
  class="bg-white py-[clamp(4rem,7vw,6.5rem)] text-[var(--brand-forest-900)]">
  <div class="mx-auto grid w-[min(88%,1400px)] gap-10 lg:grid-cols-[0.8fr_1.2fr] lg:gap-20">
    <header data-heading class="lg:sticky lg:top-28 lg:self-start">
        <p data-head class="mb-5 flex items-center gap-3 text-xs font-extrabold uppercase tracking-[0.18em] text-[var(--brand-tertiary)]">
          <span class="h-0.5 w-9 bg-[var(--brand-primary)]" aria-hidden="true"></span>
          Escríbenos
        </p>
        <h2 id="contact-form-title" data-head
          class="m-0 max-w-[14ch] text-balance text-[clamp(2.2rem,4.4vw,3.75rem)] font-extrabold leading-[1.04] tracking-[-0.04em]">
          Déjanos tu consulta.
        </h2>
        <p data-head class="mb-0 mt-5 max-w-md text-pretty text-base leading-relaxed text-[#1f1a14]/65">
          Completa tus datos y un asesor te responderá por WhatsApp.
        </p>
    </header>

    <div>
      <form data-form class="grid gap-5" (submit)="submit($event)">
        <div data-field class="grid gap-4 sm:grid-cols-2">
          <label class="block">
            <span class="mb-2 block text-xs font-extrabold uppercase tracking-[0.14em] text-[var(--brand-forest-900)]/60">Nombre</span>
            <input name="name" type="text" autocomplete="name" placeholder="Tu nombre completo" required minlength="3" [class]="fieldClass" />
          </label>
          <label class="block">
            <span class="mb-2 block text-xs font-extrabold uppercase tracking-[0.14em] text-[var(--brand-forest-900)]/60">Celular</span>
            <input name="phone" type="tel" autocomplete="tel" inputmode="tel" placeholder="9XX XXX XXX" required pattern="[0-9+\s]{9,15}" [class]="fieldClass" />
          </label>
        </div>

        <label data-field class="block">
          <span class="mb-2 block text-xs font-extrabold uppercase tracking-[0.14em] text-[var(--brand-forest-900)]/60">Correo electrónico</span>
          <input name="email" type="email" autocomplete="email" placeholder="nombre@correo.com" required [class]="fieldClass" />
        </label>

        <label data-field class="block">
          <span class="mb-2 block text-xs font-extrabold uppercase tracking-[0.14em] text-[var(--brand-forest-900)]/60">Mensaje</span>
          <textarea name="message" rows="4" required placeholder="¿Qué te gustaría saber? Lotes, precios, formas de pago…"
            class="w-full resize-y rounded-2xl border-2 border-[#6f8f7e] bg-[#fbfaf6] px-4 py-3.5 text-sm text-[var(--brand-forest-900)] outline-none transition-[border-color,box-shadow,background-color] duration-300 placeholder:text-[var(--brand-forest-900)]/45 hover:border-[#03301A] focus:border-[#FB7A11] focus:bg-white focus:shadow-[0_0_0_4px_rgb(251_122_17/0.15)] motion-reduce:transition-none"></textarea>
        </label>

        <div data-field class="flex flex-wrap items-center gap-x-6 gap-y-3">
          <button type="submit"
            class="group/btn relative isolate inline-flex min-h-13 cursor-pointer items-center gap-3 overflow-hidden rounded-2xl border-0 bg-[var(--brand-primary)] py-2 pl-6 pr-2 text-sm font-extrabold text-white shadow-lg shadow-[var(--brand-primary)]/25 transition-transform duration-200 hover:-translate-y-0.5 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-[var(--brand-primary)] focus-visible:ring-offset-2 active:scale-[0.98] motion-reduce:transition-none">
            <span aria-hidden="true"
              class="absolute inset-0 -z-10 origin-left scale-x-0 bg-[var(--brand-forest-900)] transition-transform duration-500 ease-out group-hover/btn:scale-x-100 motion-reduce:transition-none"></span>
            Enviar mensaje
            <span class="grid size-9 place-items-center rounded-xl bg-white/15 transition-transform duration-300 group-hover/btn:translate-x-0.5 motion-reduce:transition-none">
              <ng-icon name="lucideSend" size="17" aria-hidden="true" />
            </span>
          </button>

          @if (sent()) {
          <p role="status" class="m-0 flex items-center gap-2 text-sm font-bold text-[var(--brand-forest-600)]">
            <ng-icon name="lucideCheck" size="16" aria-hidden="true" />
            Abrimos WhatsApp para que envíes tu mensaje.
          </p>
          }
        </div>
      </form>
    </div>

  </div>
</section>
