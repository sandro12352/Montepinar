<section #root aria-labelledby="detail-hero-title"
  class="relative isolate flex min-h-[clamp(36rem,92vh,60rem)] items-end overflow-hidden bg-[var(--brand-forest-900)] pt-[clamp(8rem,13vw,10.5rem)] text-white">
  <div class="absolute inset-0 -z-20 overflow-hidden" aria-hidden="true">
    <img data-hero-zoom class="size-full object-cover" [src]="project().image" [alt]="project().imageAlt" fetchpriority="high" />
  </div>
  <span aria-hidden="true"
    class="absolute inset-0 -z-10 bg-[linear-gradient(to_right,rgb(3_48_26/0.82)_0%,rgb(3_48_26/0.45)_38%,transparent_70%),linear-gradient(to_top,rgb(3_48_26/0.55)_0%,transparent_32%)]"></span>

  <div class="mx-auto w-[85%]  pb-[clamp(2.5rem,5vw,4rem)]">
    <nav data-reveal hlmBreadcrumb aria-label="Migas de pan" class="mb-8">
      <ol hlmBreadcrumbList class="gap-1.5 text-xs font-extrabold uppercase tracking-[0.14em] text-white/70 sm:gap-2">
        <li hlmBreadcrumbItem>
          <a hlmBreadcrumbLink link="/" class="text-white/70 no-underline hover:text-white">Inicio</a>
        </li>
        <li hlmBreadcrumbSeparator class="text-white/50"></li>
        <li hlmBreadcrumbItem>
          <a hlmBreadcrumbLink link="/projects" class="text-white/70 no-underline hover:text-white">Proyectos</a>
        </li>
        <li hlmBreadcrumbSeparator class="text-white/50"></li>
        <li hlmBreadcrumbItem>
          <span hlmBreadcrumbPage class="text-white">{{ project().name }}</span>
        </li>
      </ol>
    </nav>

    <div class="grid items-end gap-10">
      <div class="flex flex-col items-start">
        <p data-reveal
          class="m-0 inline-flex items-center gap-2 rounded-full border border-white/20 bg-white/10 px-4 py-1.5 text-xs font-extrabold uppercase tracking-[0.16em] backdrop-blur-sm">
          <span class="size-1.5 rounded-full"
            [class]="project().status === 'En construcción' ? 'bg-[var(--brand-primary)]' : 'bg-[var(--brand-forest-400)]'"
            aria-hidden="true"></span>
          {{ project().status }} · {{ project().location }}
        </p>

        <h1 id="detail-hero-title" data-reveal
          class="m-0 mt-6 max-w-[16ch] text-balance text-[clamp(2.75rem,6vw,5.25rem)] font-extrabold leading-[1.02] tracking-[-0.045em]">
          {{ project().name }}
        </h1>

        <p data-reveal class="mb-0 mt-5 max-w-xl text-pretty text-lg font-semibold leading-[1.6] text-[var(--brand-orange-300)]">
          {{ project().tagline }}
        </p>

        <div data-reveal class="mt-8 flex flex-wrap items-center gap-3">
          <button type="button" (click)="openVisit()"
            class="group/btn relative isolate inline-flex min-h-12 cursor-pointer items-center gap-3 overflow-hidden rounded-xl border-0 bg-[var(--brand-primary)] px-6 py-3.5 text-sm font-extrabold text-white shadow-lg shadow-black/25 transition-transform duration-200 hover:-translate-y-0.5 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-white focus-visible:ring-offset-2 focus-visible:ring-offset-[var(--brand-forest-900)] motion-reduce:transition-none">
            <span aria-hidden="true"
              class="absolute inset-0 origin-left scale-x-0 bg-[var(--brand-orange-600)] transition-transform duration-500 ease-out group-hover/btn:scale-x-100 group-focus-visible/btn:scale-x-100 motion-reduce:transition-none"></span>
            <ng-icon name="lucideCalendarDays" size="18" aria-hidden="true" class="relative z-10" />
            <span class="relative z-10">Agendar visita</span>
          </button>
          <a [href]="whatsappLink()" target="_blank" rel="noopener noreferrer"
            class="group/btn relative isolate inline-flex min-h-12 items-center gap-3 overflow-hidden rounded-xl border border-white/60 bg-white/10 px-6 py-3.5 text-sm font-extrabold text-white no-underline backdrop-blur-sm transition-transform duration-200 hover:-translate-y-0.5 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-white motion-reduce:transition-none">
            <span aria-hidden="true"
              class="absolute inset-0 origin-left scale-x-0 bg-white/20 transition-transform duration-500 ease-out group-hover/btn:scale-x-100 motion-reduce:transition-none"></span>
            <ng-icon name="lucideMessageCircle" size="18" aria-hidden="true" class="relative z-10" />
            <span class="relative z-10">Pedir información</span>
          </a>
        </div>
      </div>

    </div>

    <dl class="m-0 mt-10 grid grid-cols-2 gap-px overflow-hidden rounded-2xl bg-white/15 sm:grid-cols-5">
      <div data-fact class="col-span-2 bg-[var(--brand-primary)] px-5 py-5 sm:col-span-1 sm:px-6">
        <dd class="m-0 text-2xl font-extrabold leading-none tracking-tight sm:text-3xl">{{ price() }}</dd>
        <dt class="mt-2 text-[0.7rem] font-bold uppercase tracking-[0.14em] text-white/85">Lotes desde</dt>
      </div>
      @for (fact of project().facts; track fact.label) {
      <div data-fact class="bg-[var(--brand-forest-900)]/85 px-5 py-5 backdrop-blur-sm sm:px-6">
        <dd class="m-0 text-2xl font-extrabold leading-none tracking-tight sm:text-3xl">{{ fact.value }}</dd>
        <dt class="mt-2 text-[0.7rem] font-bold uppercase tracking-[0.14em] text-white/60">{{ fact.label }}</dt>
      </div>
      }
    </dl>
  </div>
</section>
