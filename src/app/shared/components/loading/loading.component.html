<div #root
  class="fixed inset-0 z-100 text-white"
  [class.hidden]="done()"
  role="status" aria-live="polite" aria-label="Cargando Montepinar">

  <!-- Portón -->
  <div data-panel="top" class="absolute inset-x-0 top-0 h-1/2 bg-[#1f1a14]"></div>
  <div data-panel="bottom" class="absolute inset-x-0 bottom-0 h-1/2 bg-[#1f1a14]"></div>

  <div class="relative z-10 flex h-full flex-col items-center justify-center gap-10 px-6">

    <!-- Casa -->
    <div class="grid w-full max-w-md place-items-center">
      <svg viewBox="0 0 400 300" class="w-full overflow-visible" fill="none" aria-hidden="true">

        <!-- Terreno -->
        <path data-plot d="M10 266L55 238H345L390 266Z"
          class="fill-[#f39432]/25 stroke-[#f39432]" stroke-width="2" stroke-dasharray="6 6" />

        <g data-house>
          <path data-draw="ground" pathLength="1" d="M30 250H370" class="stroke-white/50" stroke-width="2" stroke-linecap="round" />

          <path data-draw="body" pathLength="1" d="M110 250V140H290V250" class="stroke-white" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" />

          <path data-draw="roof" pathLength="1" d="M88 150L200 58L312 150" class="stroke-[#f39432]" stroke-width="4" stroke-linejoin="round" stroke-linecap="round" />

          <!-- Logo dentro del techo -->
          <image data-logo href="/images/logo.png" x="155" y="90" width="90" height="44"
            preserveAspectRatio="xMidYMid meet" />

          <path data-draw="detail" pathLength="1" d="M258 100V68H278V116" class="stroke-white" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" />

          <path data-draw="detail" pathLength="1" d="M180 250V190H220V250" class="stroke-[#ffc176]" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" />

          <rect data-draw="detail" data-window pathLength="1" x="126" y="168" width="34" height="34" rx="3" class="stroke-white fill-transparent" stroke-width="3" />
          <rect data-draw="detail" data-window pathLength="1" x="240" y="168" width="34" height="34" rx="3" class="stroke-white fill-transparent" stroke-width="3" />
        </g>

        <!-- Pin -->
        <g transform="translate(345 232)">
          <g data-pin>
            <path d="M0 0C-8-10-12-15-12-21a12 12 0 1 1 24 0C12-15 8-10 0 0Z" class="fill-[#f39432] stroke-white" stroke-width="2" />
            <circle cx="0" cy="-21" r="4" class="fill-[#1f1a14]" />
          </g>
        </g>
      </svg>
    </div>

    <!-- Fase + anillo de progreso -->
    <div data-fade class="flex flex-col items-center gap-6 text-center">
      <p #phase data-text class="m-0 text-sm font-extrabold uppercase tracking-[0.2em] text-[#ffc176]">
        Buscando tu lote ideal
      </p>

      <div data-text class="relative size-24">
        <svg viewBox="0 0 80 80" class="size-full -rotate-90" fill="none" aria-hidden="true">
          <circle cx="40" cy="40" r="34" class="stroke-white/15" stroke-width="3" />
          <circle data-progress pathLength="1" cx="40" cy="40" r="34"
            class="stroke-[#f39432]" stroke-width="3" stroke-linecap="round" />
        </svg>

        <div class="absolute inset-0 grid place-items-center">
          <div class="flex items-baseline gap-0.5 font-extrabold leading-none">
            <span #percent class="text-2xl tabular-nums">0</span>
            <span class="text-xs text-[#f39432]">%</span>
          </div>
        </div>
      </div>
    </div>

  </div>
</div>
