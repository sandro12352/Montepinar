<header #header class="site-header invisible absolute inset-x-0 top-0 z-50" [class.header-scrolled]="scrolled()">
  <div class="header-inner mx-auto flex h-[5.25rem] max-w-7xl items-center justify-between gap-5 px-9">
    <a
      data-anim="logo"
      class="header-logo flex shrink-0 items-center rounded-lg focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-[var(--brand-primary)] focus-visible:ring-offset-4"
      href="#inicio"
      aria-label="Montepinar, volver al inicio"
      (click)="closeMenu()"
    >
      <img
        class="block h-auto w-32 sm:w-42"
        [src]="scrolled() ? whiteHeaderLogoSrc : transparentHeaderLogoSrc"
        alt="Montepinar"
      />
    </a>

    <nav
      #nav
      id="main-navigation"
      class="header-nav"
      [class.header-nav-open]="menuOpen()"
      aria-label="Navegación principal"
    >
      @for (item of navigationItems; track item.fragment) {
        <a data-anim="link" class="header-link" [href]="'#' + item.fragment" (click)="closeMenu()">
          {{ item.label }}
        </a>
      }
      <button
        data-anim="cta"
        class="header-contact"
        type="button"
        aria-label="Agendar una visita a Montepinar"
        (click)="openVisitSheet()"
      >
        Agendar visita
      </button>
    </nav>

    <button
      class="header-toggle"
      type="button"
      [attr.aria-label]="menuOpen() ? 'Cerrar menú de navegación' : 'Abrir menú de navegación'"
      [attr.aria-expanded]="menuOpen()"
      aria-controls="main-navigation"
      (click)="toggleMenu()"
    >
      <span class="menu-lines" [class.menu-lines-open]="menuOpen()" aria-hidden="true">
        <span></span><span></span><span></span>
      </span>
    </button>
  </div>
</header>

@defer (when visitSheetRequest() > 0) {
  <app-visit-sheet [openRequest]="visitSheetRequest()" />
}
