<header #header class="fixed inset-x-0 top-0 z-50 text-white">

  <!-- Barra superior (se colapsa al hacer scroll) -->
  <div #bar class="overflow-hidden bg-[#1f1a14] text-white">
    <p data-anim="bar" class="m-0 px-4 py-2 text-center text-xs font-semibold tracking-wide sm:text-sm">
      <span class="text-[#f39432]" aria-hidden="true">✦</span>
      ¡Descubre todo lo que Montepinar tiene para ofrecerte!
      <a class="ml-2 font-extrabold text-[#ffc176] underline decoration-2 underline-offset-2 transition-opacity hover:opacity-70 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-[#ffc176]"
         href="#urbanizacion">Conócenos →</a>
    </p>
  </div>

  <!-- Contenedor flotante -->
  <div class="mx-auto max-w-330 px-3 transition-[padding] duration-300 sm:px-5"
       [class]="scrolled() ? 'pt-2' : 'pt-4'">

    <div class="relative flex items-center justify-between gap-4 rounded-2xl border px-3 py-2 transition-all duration-300 sm:px-4"
         [class]="scrolled()
           ? 'border-white/15 bg-black/65 shadow-xl shadow-black/25 backdrop-blur-lg'
           : 'border-white/20 bg-black/20 backdrop-blur-md'">

      <!-- Logo -->
      <a data-anim="logo"
         class="flex shrink-0 items-center rounded-xl px-2 py-1 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-white"
         href="#inicio" aria-label="Montepinar, volver al inicio" (click)="closeMenu()">
        <img class="block transition-[width] duration-300"
             [class]="scrolled() ? 'w-28' : 'w-36'"
             src="/images/logo.png" alt="Montepinar" />
      </a>

      <div class="flex items-center gap-2">

        <nav #nav id="main-navigation" aria-label="Navegación principal"
             class="absolute left-0 right-0 top-[calc(100%+0.5rem)] flex flex-col gap-1 rounded-2xl border border-white/15 bg-black/85 p-3 shadow-2xl backdrop-blur-xl md:static md:flex md:flex-row md:items-center md:gap-1 md:rounded-none md:border-0 md:bg-transparent md:p-0 md:shadow-none md:backdrop-blur-none"
             [class]="menuOpen() ? '' : 'max-md:hidden'">

          @for (item of navigationItems; track item.fragment) {
          <a data-anim="link"
             class="group relative rounded-xl px-4 py-2.5 text-sm font-semibold text-white/85 transition-colors hover:bg-white/10 hover:text-white focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-white max-md:text-center"
             [href]="'#' + item.fragment" (click)="closeMenu()">
            {{ item.label }}
            <span class="absolute inset-x-4 bottom-1 h-0.5 origin-center scale-x-0 rounded-full bg-[#f39432] transition-transform duration-300 group-hover:scale-x-100"
                  aria-hidden="true"></span>
          </a>
          }

          <!-- CTA: esquinas suaves, relleno que sube en hover -->
          <a data-anim="cta"
             class="group relative mt-1 inline-flex items-center justify-center gap-2 overflow-hidden rounded-xl bg-[#f39432] px-5 py-2.5 text-sm font-extrabold text-[#1f1a14] no-underline shadow-lg shadow-black/20 transition-colors duration-300 hover:text-white focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-[#ffc176] md:mt-0 md:ml-2"
             href="#contacto" (click)="closeMenu()">
            <span class="absolute inset-0 origin-bottom scale-y-0 bg-[#1f1a14] transition-transform duration-500 ease-out group-hover:scale-y-100"
                  aria-hidden="true"></span>
            <span class="relative z-10">Contáctanos</span>
            <span class="relative z-10 transition-transform duration-300 group-hover:translate-x-1 group-hover:-translate-y-0.5" aria-hidden="true">↗</span>
          </a>
        </nav>

        <!-- Hamburguesa (solo móvil) -->
        <button hlmBtn variant="outline" size="icon"
                class="rounded-xl text-white hover:bg-white/10 hover:text-white md:hidden"
                type="button"
                [attr.aria-label]="menuOpen() ? 'Cerrar menú de navegación' : 'Abrir menú de navegación'"
                [attr.aria-expanded]="menuOpen()"
                aria-controls="main-navigation"
                (click)="toggleMenu()">
          <span class="relative block h-4 w-5" aria-hidden="true">
            <span class="absolute left-0 h-0.5 w-full rounded-full bg-current transition-all duration-300"
                  [class]="menuOpen() ? 'top-1/2 -translate-y-1/2 rotate-45' : 'top-0'"></span>
            <span class="absolute left-0 top-1/2 h-0.5 w-full -translate-y-1/2 rounded-full bg-current transition-all duration-300"
                  [class]="menuOpen() ? 'opacity-0' : 'opacity-100'"></span>
            <span class="absolute left-0 h-0.5 w-full rounded-full bg-current transition-all duration-300"
                  [class]="menuOpen() ? 'top-1/2 -translate-y-1/2 -rotate-45' : 'bottom-0'"></span>
          </span>
        </button>

      </div>
    </div>
  </div>
</header>
