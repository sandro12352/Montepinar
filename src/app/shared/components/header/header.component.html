<header #header class="invisible fixed inset-x-0 top-0 z-50 text-white ">

  <!-- Barra superior (se colapsa al hacer scroll) -->
  <div #bar class="overflow-hidden bg-(--brand-tertiary) text-white">
    <p data-anim="bar" class="m-0 px-4 py-2 text-center text-xs font-semibold tracking-wide sm:text-sm">
      <span class="text-[var(--brand-primary)]" aria-hidden="true">✦</span>
      ¡Descubre todo lo que Montepinar tiene para ofrecerte!
      <a class="ml-2 font-extrabold text-[var(--brand-complementary-light)] underline decoration-2 underline-offset-2 transition-opacity hover:opacity-70 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-[var(--brand-primary)]"
         href="#urbanizacion"><span>Conócenos</span><ng-icon name="lucideMapPin" size="16" aria-hidden="true" /></a>
    </p>
  </div>

  <!-- Contenedor flotante -->
  <div class="w-full px-2 pt-1 transition-[padding] duration-300 sm:px-5"
      >

    <div class="relative flex w-full items-center justify-between gap-4 bg-transparent px-4 py-2 lg:max-w-[80vw] mx-auto">

      <!-- Logo -->
      <a data-anim="logo"
         class="flex shrink-0 items-center rounded-xl  focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-[var(--brand-primary)]"
         href="#inicio" aria-label="Montepinar, volver al inicio" (click)="closeMenu()">
        <img class="block h-auto w-32 transition-[width] duration-300"
             
             src="/images/logo.webp" alt="Montepinar" />
      </a>

      <div class="flex items-center gap-2">

        <nav #nav id="main-navigation" aria-label="Navegación principal"
             class="absolute left-0 right-0 top-[calc(100%+0.5rem)] flex flex-col gap-1 rounded-2xl bg-white/95 p-3 shadow-2xl backdrop-blur-sm md:static md:flex md:flex-row md:items-center md:gap-1 md:rounded-none md:bg-transparent md:p-0 md:shadow-none md:backdrop-blur-none"
             [class]="menuOpen() ? '' : 'max-md:hidden'">

          @for (item of navigationItems; track item.fragment) {
          <a data-anim="link"
             class="group relative inline-flex items-center justify-center gap-2 rounded-xl px-4 py-2.5 text-sm font-semibold text-white transition-colors hover:opacity-75 focus-visible:outline-none focus-visible:ring-2 max-md:text-center"
             [href]="'#' + item.fragment" (click)="closeMenu()">
            <ng-icon [name]="item.icon" size="18" aria-hidden="true" />
            {{ item.label }}
            <span class="absolute inset-x-4 bottom-1 h-0.5 origin-center scale-x-0 rounded-full bg-[var(--brand-primary)] transition-transform duration-300 group-hover:scale-x-100"
                  aria-hidden="true"></span>
          </a>
          }

          <!-- Contacto de ventas -->
          <a data-anim="cta"
             class="group mt-1 inline-flex items-center justify-center gap-2 rounded-xl bg-[var(--brand-primary)] px-4 py-2.5 text-sm font-bold text-white no-underline transition-colors hover:bg-[var(--brand-tertiary)] focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-[var(--brand-primary)] md:mt-0 md:ml-2"
             href="tel:+51932284185" aria-label="Llamar a ventas al 932 284 185" (click)="closeMenu()">
            <ng-icon name="lucidePhone" size="18" aria-hidden="true" />
            <span>Ventas: 932 284 185</span>
          </a>

          <!-- Contacto de postventa -->
          <a data-anim="cta"
             class="mt-1 inline-flex items-center justify-center gap-2 rounded-xl bg-[var(--brand-tertiary)] px-3 py-2.5 text-sm font-bold text-white no-underline transition-colors hover:bg-[var(--brand-primary)] focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-[var(--brand-primary)] md:mt-0 md:ml-1"
             href="tel:+51920018214" aria-label="Llamar a postventa para asociados al 920 018 214" (click)="closeMenu()">
            <ng-icon name="lucidePhone" size="16" aria-hidden="true" />
            <span>Postventa: 920 018 214</span>
          </a>
        </nav>

        <!-- Hamburguesa (solo móvil) -->
        <button hlmBtn variant="outline" size="icon"
                class="rounded-xl text-white hover:bg-white/10 hover:text-white md:hidden"
                type="button"
                [attr.aria-label]="menuOpen() ? 'Cerrar menú de navegación' : 'Abrir menú de navegación'"
                [attr.aria-expanded]="menuOpen()"
                aria-controls="main-navigation"
                (click)="toggleMenu()">
          <span class="relative block h-4 w-5" aria-hidden="true">
            <span class="absolute left-0 h-0.5 w-full rounded-full bg-current transition-all duration-300"
                  [class]="menuOpen() ? 'top-1/2 -translate-y-1/2 rotate-45' : 'top-0'"></span>
            <span class="absolute left-0 top-1/2 h-0.5 w-full -translate-y-1/2 rounded-full bg-current transition-all duration-300"
                  [class]="menuOpen() ? 'opacity-0' : 'opacity-100'"></span>
            <span class="absolute left-0 h-0.5 w-full rounded-full bg-current transition-all duration-300"
                  [class]="menuOpen() ? 'top-1/2 -translate-y-1/2 -rotate-45' : 'bottom-0'"></span>
          </span>
        </button>

      </div>
    </div>
  </div>

</header>
