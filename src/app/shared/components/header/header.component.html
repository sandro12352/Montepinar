<header #header
  class="invisible absolute inset-x-0 top-2 z-50 text-white transition-[background-color,box-shadow] duration-200 motion-reduce:transition-none"
  [class.bg-white]="scrolled()" [style.background-color]="scrolled() ? 'var(--card)' : 'transparent'"
  [style.color]="scrolled() ? 'var(--foreground)' : '#FFFFFF'" [class.shadow-lg]="scrolled()">
  <div class="mx-auto flex w-[85%] items-center justify-between gap-5 py-2 max-md:w-full max-m:px-5">
    <a data-anim="logo"
      class="col-start-1 row-start-1 flex w-fit shrink-0 items-center rounded-lg focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-[var(--brand-primary)] focus-visible:ring-offset-4 max-md:p-1.5"
      href="#inicio" aria-label="Montepinar, volver al inicio" (click)="closeMenu()">
      <img class="block h-auto w-32 sm:w-42" [src]="scrolled() ? whiteHeaderLogoSrc : transparentHeaderLogoSrc"
        alt="Montepinar" />
    </a>

    <nav #nav id="main-navigation"
      class="hidden w-full items-center gap-[clamp(0.5rem,1.5vw,1.5rem)] text-inherit md:col-start-2 md:row-start-1 md:flex md:w-max md:justify-self-center max-md:col-span-2 max-md:col-start-1 max-md:row-start-2 max-md:flex-col max-md:items-stretch max-md:gap-1 max-md:rounded-2xl max-md:border max-md:border-stone-900/10 max-md:bg-white max-md:p-3 max-md:text-stone-900 max-md:shadow-[0_16px_36px_rgb(31_26_20_/_16%)]"
      [class.flex]="menuOpen()" [class.hidden]="!menuOpen()" aria-label="Navegación principal">
      @for (item of navigationItems; track item.fragment) {
      <a data-anim="link"
        class="relative px-1 py-[0.65rem] text-[0.92rem] font-semibold no-underline transition-colors duration-200 after:absolute after:bottom-[0.35rem] after:left-1 after:right-1 after:h-0.5 after:origin-left after:scale-x-0 after:bg-(--brand-primary) after:transition-transform after:duration-200 after:content-[''] hover:after:scale-x-100 focus-visible:after:scale-x-100"
        [style.color]="scrolled() || menuOpen()? 'var(--foreground)': '#FFFFFF'" [href]="'#' + item.fragment"
        (click)="closeMenu()">{{ item.label }}</a>
      }
      <button data-anim="cta"
        class="group relative isolate inline-flex min-h-[2.9rem] items-center justify-center gap-2 overflow-hidden rounded-xl border-0 bg-primary text-primary-foreground px-[1.4rem] text-[0.9rem] font-extrabold transition-transform duration-200 hover:-translate-y-px focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-[var(--brand-tertiary)] focus-visible:ring-offset-2 md:hidden max-md:mt-1 motion-reduce:transition-none"
        type="button" (click)="openVisitSheet()">
        <span aria-hidden="true" class="absolute inset-0 origin-left scale-x-0 bg-[var(--brand-tertiary)] transition-transform duration-500 ease-out group-hover:scale-x-100 motion-reduce:transition-none"></span>
        <span class="relative z-10">Agendar visita</span>
        <ng-icon name="lucideArrowRight" size="18" aria-hidden="true"
          class="transition-transform duration-200 group-hover:-translate-y-0.5 motion-reduce:transition-none" />
      </button>
    </nav>

    <button data-anim="cta"
      class="group relative isolate col-start-3 row-start-1 inline-flex min-h-[2.9rem] items-center justify-center justify-self-end gap-2 overflow-hidden rounded-xl border-0 bg-primary px-[1.4rem] text-[0.9rem] font-extrabold text-primary-foreground transition-transform duration-200 hover:-translate-y-px focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-[var(--brand-forest-500)] focus-visible:ring-offset-2 max-md:hidden motion-reduce:transition-none hover:cursor-pointer"
      type="button" aria-label="Agendar una visita a Montepinar" (click)="openVisitSheet()">
      <span aria-hidden="true"
        class="absolute inset-0 origin-left scale-x-0 bg-(--brand-orange-600) transition-transform duration-500 ease-out group-hover:scale-x-100 motion-reduce:transition-none"></span>

      <span class="relative z-10">
        Agendar visita
      </span>

      <ng-icon name="lucideArrowRight" size="18" aria-hidden="true"
        class="relative z-10 transition-transform duration-200 group-hover:-translate-y-0.5 motion-reduce:transition-none" />
    </button>

    <button
      class="col-start-2 row-start-1 grid size-11 place-items-center rounded-xl border border-white/75 bg-white text-stone-900 shadow-[0_3px_12px_rgb(31_26_20_/_14%)] md:hidden"
      type="button" [attr.aria-label]="menuOpen() ? 'Cerrar menú de navegación' : 'Abrir menú de navegación'"
      [attr.aria-expanded]="menuOpen()" aria-controls="main-navigation" (click)="toggleMenu()">
      <span class="relative flex h-4 w-[1.2rem] flex-col justify-between" aria-hidden="true">
        <span class="h-0.5 w-full rounded-sm bg-current transition-transform duration-200 motion-reduce:transition-none"
          [class.translate-y-1.5]="menuOpen()" [class.rotate-45]="menuOpen()"></span>
        <span class="h-0.5 w-full rounded-sm bg-current transition-opacity duration-200 motion-reduce:transition-none"
          [class.opacity-0]="menuOpen()"></span>
        <span class="h-0.5 w-full rounded-sm bg-current transition-transform duration-200 motion-reduce:transition-none"
          [class.-translate-y-1.5]="menuOpen()" [class.-rotate-45]="menuOpen()"></span>
      </span>
    </button>
  </div>
</header>

<app-visit-sheet></app-visit-sheet>
