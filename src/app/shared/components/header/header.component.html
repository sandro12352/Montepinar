<header class="fixed inset-x-0 top-0 z-10 text-white">
  <div class="border-b border-white/15 bg-[#f39432] px-4 py-2 text-center text-xs font-semibold tracking-wide text-[#173e37] sm:text-sm">
    <p class="m-0">
      <span aria-hidden="true">✨</span>
      ¡Descubre todo lo que Montepinar tiene para ofrecerte!
      <a class="ml-2 font-extrabold underline decoration-2 underline-offset-2 transition-opacity hover:opacity-70 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-[#173e37]" href="#urbanizacion">Conócenos <span aria-hidden="true">→</span></a>
    </p>
  </div>
  <div class="relative mx-auto flex min-h-[5.25rem] max-w-[78rem] items-center justify-between gap-8 px-5 py-3 max-[420px]:px-4">
    <a class="shrink-0 " href="#inicio" aria-label="Montepinar, volver al inicio" (click)="closeMenu()">
      <img class="block w-40" src="/images/logo.png" alt="Montepinar" />
    </a>

    <div class="flex items-center gap-5">
      <nav
        id="main-navigation"
        [class]="menuOpen() ? 'absolute left-4 right-4 top-[calc(100%+0.65rem)] flex flex-col items-stretch gap-1 rounded-2xl border border-white/20 bg-[#073d35]/95 p-3 text-white shadow-2xl md:static md:flex-row md:items-center md:gap-1 md:border-0 md:bg-transparent md:p-0 md:shadow-none' : 'absolute left-4 right-4 top-[calc(100%+0.65rem)] hidden flex-col items-stretch gap-1 rounded-2xl border border-white/20 bg-[#073d35]/95 p-3 text-white shadow-2xl md:static md:flex md:flex-row md:items-center md:gap-1 md:border-0 md:bg-transparent md:p-0 md:shadow-none'"
        aria-label="Navegación principal"
      >
        @for (item of navigationItems; track item.fragment) {
          <a class="relative rounded-md px-3 py-2.5 text-sm font-semibold text-white/85 transition-colors after:absolute after:bottom-1 after:left-3 after:right-3 after:h-0.5 after:scale-x-0 after:rounded-full after:bg-white after:transition-transform hover:text-white hover:after:scale-x-100 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-white max-md:text-center" [href]="'#' + item.fragment" (click)="closeMenu()">{{ item.label }}</a>
        }
        <a class="inline-flex items-center justify-center gap-2 rounded-full bg-primary px-5 py-3 text-sm font-bold text-primary-foreground no-underline transition-transform hover:-translate-y-0.5 hover:shadow-lg focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-ring max-md:mt-1 max-md:w-full" href="#contacto" (click)="closeMenu()">Contacta con nosotros <span aria-hidden="true">↗</span></a>
      </nav>

      <button
        hlmBtn
        variant="outline"
        size="icon"
        class="text-white hover:bg-white/10 hover:text-white md:hidden"
        type="button"
        [attr.aria-label]="menuOpen() ? 'Cerrar menú de navegación' : 'Abrir menú de navegación'"
        [attr.aria-expanded]="menuOpen()"
        aria-controls="main-navigation"
        (click)="toggleMenu()"
      >
        <span class="text-lg leading-none" aria-hidden="true">☰</span>
      </button>
    </div>
  </div>
</header>
