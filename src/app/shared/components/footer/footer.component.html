<footer #root aria-label="Pie de página"
  class="relative isolate overflow-hidden bg-[#f4f1ea] pt-[clamp(3.5rem,6vw,5.5rem)] text-[var(--brand-forest-900)]">
  <div class="mx-auto w-[min(88%,1400px)]">

    <!-- Fila superior: columnas a la izquierda, marca y contacto a la derecha -->
    <div class="flex flex-col gap-12 md:flex-row md:justify-between lg:gap-16">
      <div data-footer-reveal class="grid grid-cols-2 gap-x-8 gap-y-10 sm:grid-cols-3 md:w-full md:max-w-[34rem]">
        @for (column of columns; track column.title) {
        <nav [attr.aria-label]="column.title" class="flex flex-col gap-5">
          <h2 class="m-0 text-lg font-semibold leading-none tracking-[-0.02em] text-[var(--brand-forest-900)]/60">{{ column.title }}</h2>
          <ul class="m-0 grid list-none gap-2 p-0">
            @for (link of column.links; track link.label) {
            <li>
              <a [href]="link.href"
                class="text-base font-medium leading-[1.6] tracking-[-0.02em] text-[var(--brand-forest-900)] no-underline transition-colors duration-200 hover:text-[var(--brand-primary)] focus-visible:text-[var(--brand-primary)] focus-visible:outline-none sm:text-lg">{{
                link.label }}</a>
            </li>
            }
          </ul>
        </nav>
        }
      </div>

      <div data-footer-reveal class="flex flex-col items-start md:w-full md:max-w-[19rem]">
        <a href="/" class="inline-block pb-6" aria-label="Montepinar, ir al inicio">
          <img class="block h-auto w-40" src="/images/logo.webp" alt="Montepinar Inmobiliaria & Constructora"
            loading="lazy" />
        </a>
        <a href="tel:+51932284185"
          class="flex items-center gap-4 pb-4 text-base font-medium tracking-[-0.02em] text-[var(--brand-forest-900)] no-underline transition-colors duration-200 hover:text-[var(--brand-primary)] sm:text-lg">
          <ng-icon name="lucidePhone" size="22" class="shrink-0" aria-hidden="true" />
          +51 932 284 185
        </a>
        <a href="https://wa.me/51932284185" target="_blank" rel="noopener noreferrer"
          class="flex items-center gap-4 text-base font-medium tracking-[-0.02em] text-[var(--brand-forest-900)] no-underline transition-colors duration-200 hover:text-[var(--brand-primary)] sm:text-lg">
          <ng-icon name="lucideMessageCircle" size="22" class="shrink-0" aria-hidden="true" />
          Escríbenos por WhatsApp
        </a>
        <p class="m-0 mb-3 mt-8 text-sm font-semibold text-[var(--brand-forest-900)]/60">Síguenos</p>
        <app-social-links />
      </div>
    </div>

    <!-- Copyright -->
    <div data-footer-reveal
      class="flex flex-col gap-3 pt-10 text-sm tracking-[-0.02em] text-[var(--brand-forest-900)] md:flex-row md:items-center md:justify-between md:pr-[45px] lg:text-lg">
      <a href="/terminos-y-condiciones"
        class="text-[var(--brand-forest-900)] underline-offset-4 transition-colors hover:text-[var(--brand-primary)] hover:underline focus-visible:outline-none focus-visible:text-[var(--brand-primary)]">Términos y condiciones</a>
      <p class="m-0">© {{ year }} Montepinar, Todos los derechos reservados</p>
    </div>
  </div>

  <!-- Imagen del proyecto con marca gigante -->
  <div data-footer-image class="relative mx-auto mt-4  w-full overflow-hidden" aria-hidden="true">
    <img data-footer-zoom class="relative z-10 block h-full w-full origin-bottom [mask-image:linear-gradient(to_bottom,transparent_20%,#000_54%)]"
      src="/images/Entrada%20Montepinar%20entre%20jardines%20y%20banderas.png" alt="" loading="lazy" />
    <span
      class="pointer-events-none absolute inset-x-0 top-[-6%] z-0 select-none text-center text-[clamp(3.5rem,16vw,14rem)] font-black leading-none tracking-[-0.04em] text-[var(--brand-forest-900)]/[0.29]">
      Montepinar
    </span>
  </div>
</footer>
